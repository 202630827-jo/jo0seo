<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 먹을 아침 메뉴 추천 🍳</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fff9e6 0%, #ffeedd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #4a3b32;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(212, 143, 56, 0.15);
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 2px solid #ffe4bc;
            backdrop-filter: blur(10px);
        }

        .tag {
            display: inline-block;
            background-color: #fff0d6;
            color: #d97706;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #2d2118;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        p.subtitle {
            font-size: 15px;
            color: #7c6f65;
            margin-bottom: 30px;
        }

        .card-box {
            background-color: #fffaf0;
            border: 2px dashed #ffd8a8;
            border-radius: 20px;
            padding: 35px 20px;
            margin-bottom: 30px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .emoji-display {
            font-size: 80px;
            line-height: 1;
            margin-bottom: 15px;
            transition: transform 0.2s ease;
        }

        .food-name {
            font-size: 24px;
            font-weight: 700;
            color: #38271d;
            margin-bottom: 8px;
        }

        .food-desc {
            font-size: 14px;
            color: #8c7a6b;
            word-break: keep-all;
        }

        .recommend-btn {
            background: linear-gradient(135deg, #ff922b 0%, #f59f00 100%);
            color: white;
            border: none;
            padding: 18px 36px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(245, 159, 0, 0.3);
            transition: all 0.2s ease;
            width: 100%;
            outline: none;
        }

        .recommend-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(245, 159, 0, 0.4);
            background: linear-gradient(135deg, #f59f00 0%, #f08c00 100%);
        }

        .recommend-btn:active {
            transform: translateY(1px);
            box-shadow: 0 6px 12px rgba(245, 159, 0, 0.2);
        }

        /* 통통 튀는 애니메이션 효과 */
        .bounce {
            animation: bounce 0.4s ease;
        }

        @keyframes bounce {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #b0a295;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="tag">☀️ 기분 좋은 하루의 시작</span>
        <h1>오늘 먹을 아침 메뉴 추천</h1>
        <p class="subtitle">버튼을 눌러 오늘에 딱 맞는 아침 메뉴를 찾아보세요!</p>

        <div class="card-box" id="cardBox">
            <div class="emoji-display" id="emoji">🥣</div>
            <div class="food-name" id="foodName">버튼을 눌러주세요!</div>
            <div class="food-desc" id="foodDesc">맛있는 아침 메뉴를 추천해드립니다.</div>
        </div>

        <button class="recommend-btn" id="recommendBtn" onclick="recommendMenu()">
            🍳 아침 메뉴 추천
        </button>

        <footer>오늘도 든든하고 행복한 하루 보내세요!</footer>
    </div>

    <script>
        const menuList = [
            { emoji: '🥪', name: '샌드위치', desc: '신선한 야채와 계란이 듬뿍 들어간 든든한 샌드위치!' },
            { emoji: '🥣', name: '시리얼 & 우유', desc: '바쁜 아침, 간편하고 바삭하게 즐기는 우유 한 잔!' },
            { emoji: '🍙', name: '삼각김밥 & 미소된장국', desc: '속을 따뜻하게 채워주는 깔끔한 한식 조합!' },
            { emoji: '🥐', name: '크루아상 & 커피', desc: '고소한 버터 향 가득한 빵과 따뜻한 아메리카노 한 잔!' },
            { emoji: '🥞', name: '팬케이크', desc: '달콤한 메이플 시럽을 얹은 부드러운 팬케이크!' },
            { emoji: '🍳', name: '에그 스크램블 & 베이컨', desc: '단백질 듬뿍! 몽글몽글한 계란 요리와 바삭한 베이컨!' },
            { emoji: '🥗', name: '닭가슴살 샐러드', desc: '가볍고 건강하게 하루를 시작하는 프레시 샐러드!' },
            { emoji: '🥯', name: '베이글 & 크림치즈', desc: '쫄깃한 베이글에 고소한 크림치즈를 듬뿍!' },
            { emoji: '🍌', name: '바나나 & 요거트', desc: '장 건강을 지켜주는 상큼하고 부드러운 요거트 스무디 볼!' },
            { emoji: '🍲', name: '따뜻한 전복죽', desc: '속을 편안하게 달래주는 영양 만점 속풀이 죽!' },
            { emoji: '🍞', name: '프렌치토스트', desc: '달콤하고 촉촉해서 입안에서 녹는 토스트!' },
            { emoji: '🍏', name: '사과 한 개 & 견과류', desc: '아침 사과는 금! 간편하고 건강한 아침 식단!' }
        ];

        let isSpinning = false;

        function recommendMenu() {
            if (isSpinning) return;
            isSpinning = true;

            const emojiEl = document.getElementById('emoji');
            const foodNameEl = document.getElementById('foodName');
            const foodDescEl = document.getElementById('foodDesc');
            const btn = document.getElementById('recommendBtn');

            btn.style.opacity = '0.7';
            btn.innerText = '🔄 메뉴 고르는 중...';

            // 빠른 랜덤 스롯 머신 효과
            let counter = 0;
            const interval = setInterval(() => {
                const randomTemp = menuList[Math.floor(Math.random() * menuList.length)];
                emojiEl.innerText = randomTemp.emoji;
                foodNameEl.innerText = randomTemp.name;
                foodDescEl.innerText = '오늘의 추천 메뉴를 고르고 있어요...';
                counter++;

                if (counter > 10) {
                    clearInterval(interval);
                    
                    // 최종 선택
                    const finalMenu = menuList[Math.floor(Math.random() * menuList.length)];
                    emojiEl.innerText = finalMenu.emoji;
                    foodNameEl.innerText = finalMenu.name;
                    foodDescEl.innerText = finalMenu.desc;

                    // 애니메이션 재실행
                    emojiEl.classList.remove('bounce');
                    void emojiEl.offsetWidth;
                    emojiEl.classList.add('bounce');

                    btn.style.opacity = '1';
                    btn.innerText = '🍳 아침 메뉴 다시 추천';
                    isSpinning = false;
                }
            }, 80);
        }
    </script>
</body>
</html>
